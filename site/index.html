<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>

<title>ResFunder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: SaaS shell. Left sidebar (flat nav, account + wallet at the bottom), page header with actions, pill tabs, cards and tables. ResFunder palette: warm grey, black, orange. */
:root{
  --bg:#ffffff; --card:#fafaf9; --well:#f3f2ef; --line:#e2e0db; --line-2:#cfccc5;
  --ink:#121212; --muted:#5f5f5c; --faint:#8a8a86;
  --orange:#ff8a1c; --orange-ink:#a85300; --orange-soft:#ffe7cf;
  --green:#1f7a3d; --green-soft:#dcf1e2; --green-bar:#1f7a3d;
  --yellow:#7a5c00; --yellow-soft:#fbefb8; --yellow-line:#ecdc8c; --yellow-bar:#b8890b;
  --red:#b42318; --red-soft:#fbe0dd; --red-bar:#b42318;
  --black:#121212; --on-black:#f2f1ee; --banner:#0e0e0e; --banner-ink:#d6d3cc; --phone:#0e0e0e; --scrim:rgba(18,18,18,.4);
  --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 8px 30px -12px rgba(18,18,18,.18),0 2px 6px -2px rgba(18,18,18,.06);
  --f-head:Geist,ui-sans-serif,system-ui,sans-serif; --f-body:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#ffffff; --card:#fafaf9; --well:#f3f2ef; --line:#e2e0db; --line-2:#cfccc5;
  --ink:#121212; --muted:#5f5f5c; --faint:#8a8a86;
  --orange:#ff8a1c; --orange-ink:#a85300; --orange-soft:#ffe7cf;
  --green:#1f7a3d; --green-soft:#dcf1e2; --green-bar:#1f7a3d;
  --yellow:#7a5c00; --yellow-soft:#fbefb8; --yellow-line:#ecdc8c; --yellow-bar:#b8890b;
  --red:#b42318; --red-soft:#fbe0dd; --red-bar:#b42318;
  --black:#121212; --on-black:#f2f1ee; --banner:#0e0e0e; --banner-ink:#d6d3cc; --phone:#0e0e0e; --scrim:rgba(18,18,18,.4);
  --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 8px 30px -12px rgba(18,18,18,.18),0 2px 6px -2px rgba(18,18,18,.06);
  color-scheme:light}}
:root[data-theme="dark"]{
  --bg:#ffffff; --card:#fafaf9; --well:#f3f2ef; --line:#e2e0db; --line-2:#cfccc5;
  --ink:#121212; --muted:#5f5f5c; --faint:#8a8a86;
  --orange:#ff8a1c; --orange-ink:#a85300; --orange-soft:#ffe7cf;
  --green:#1f7a3d; --green-soft:#dcf1e2; --green-bar:#1f7a3d;
  --yellow:#7a5c00; --yellow-soft:#fbefb8; --yellow-line:#ecdc8c; --yellow-bar:#b8890b;
  --red:#b42318; --red-soft:#fbe0dd; --red-bar:#b42318;
  --black:#121212; --on-black:#f2f1ee; --banner:#0e0e0e; --banner-ink:#d6d3cc; --phone:#0e0e0e; --scrim:rgba(18,18,18,.4);
  --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 8px 30px -12px rgba(18,18,18,.18),0 2px 6px -2px rgba(18,18,18,.06);
  color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.banner{background:var(--banner);color:var(--banner-ink);text-align:center;font-size:12.5px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.banner b{color:#fff;font-weight:600}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100vh - 34px)}
.side{position:sticky;top:0;align-self:start;height:calc(100vh - 34px);background:var(--card);border-right:1px solid var(--line);padding:18px 14px 14px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;font:700 21px/1 var(--f-head);letter-spacing:-.02em;padding:4px 6px}
.logo{position:relative;width:32px;height:20px;flex:none}
.logo::before,.logo::after{content:"";position:absolute;top:0;width:20px;height:20px;border-radius:50%}
.logo::before{left:0;background:var(--black)} .logo::after{left:12px;background:var(--orange);mix-blend-mode:multiply}
.brand .sp{flex:1}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);display:inline-grid;place-items:center;padding:0;flex:none}
.ibtn svg{width:17px;height:17px}
.ibtn:disabled{opacity:.35;cursor:default}
.sbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:14px;padding:0 10px 0 12px;height:44px;background:var(--card)}
.sbox svg{width:17px;height:17px;color:var(--muted);flex:none}
.sbox input{border:0;background:transparent;outline:none;width:100%;min-width:0}
.sbox kbd{font:500 11.5px/1 var(--f-mono);border:1px solid var(--line-2);border-radius:6px;padding:4px 6px;color:var(--muted)}
.nav{display:grid;gap:2px}
.nv{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:12px;color:var(--muted);font-size:15px}
.nv svg{width:19px;height:19px;flex:none}
.nv:hover{background:var(--well);color:var(--ink)}
.nv.on{color:var(--ink);font-weight:600}
.nv.top.on{background:var(--well)}
.nv .cnt{margin-left:auto}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:999px;font-size:11.5px;font-weight:600;display:inline-grid;place-items:center;background:var(--yellow-soft);color:var(--yellow)}
.side .grow{flex:1}
.acct{display:flex;align-items:center;gap:10px;background:var(--well);border-radius:16px;padding:10px 12px;border:0;width:100%;text-align:left}
.av{width:38px;height:38px;border-radius:50%;background:var(--orange);color:#1b0d00;display:grid;place-items:center;font:700 14px/1 var(--f-head);flex:none}
.acct b{display:block;font-size:14.5px}
.acct small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wchip{display:flex;align-items:center;gap:10px;font-size:13px;border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.wchip .fx{width:26px;height:26px;border-radius:8px;background:var(--orange-soft);color:var(--orange-ink);display:grid;place-items:center;flex:none}
.wchip .fx svg{width:15px;height:15px}
.wchip b{font-family:var(--f-mono);font-size:12.5px;font-weight:500;display:block}
.wchip small{color:var(--muted);font-size:12px}
.wchip .on{width:8px;height:8px;border-radius:50%;background:var(--green-bar);margin-left:auto}
.main{min-width:0;padding:22px 30px 90px;padding-right:max(30px,env(safe-area-inset-right,0px))}
.menuBtn,.menuClose{display:none}
@media(max-width:980px){.menuClose{display:inline-grid}}
.scrimSide{display:none}
@media(max-width:980px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;top:0;left:0;bottom:0;height:auto;width:min(300px,86vw);z-index:25;transform:translateX(-105%);transition:transform .2s;padding-top:max(18px,env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.2)}
  .scrimSide.open{display:block;position:fixed;inset:0;background:var(--scrim);z-index:24}
  .menuBtn{display:inline-grid}
  .main{padding:16px max(16px,env(safe-area-inset-right,0px)) 90px max(16px,env(safe-area-inset-left,0px))}
}

/* ---------- page header + tabs ---------- */
.ph{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px}
.ph .l{display:flex;align-items:center;gap:12px;min-width:0}
.crumb{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb button{border:0;background:none;padding:0;color:var(--muted)}
.crumb button:hover{color:var(--ink);text-decoration:underline}
.ph h1{font:700 clamp(24px,2.6vw,30px)/1.15 var(--f-head);letter-spacing:-.02em;margin:2px 0 0;text-wrap:balance}
.ph .acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:var(--card);border-radius:12px;padding:10px 18px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:var(--ink)}
.btn.dark{background:var(--black);color:var(--on-black);border-color:var(--black)}
.btn.red{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line-2))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.block{width:100%;padding:13px 20px;font-size:16px}
.btn.fund{display:inline-flex;grid-template-columns:none;background:var(--orange);color:#1b0d00;border-color:var(--orange);border-radius:999px;padding:11px 22px;font-weight:600;box-shadow:0 6px 18px color-mix(in srgb,var(--orange) 35%,transparent)}
.btn.fund:hover{filter:brightness(1.05);border-color:var(--orange)}
.btn.pill{border-radius:999px}
.tabsrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.tabs{display:inline-flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 18px;border-radius:12px;font-size:15px;color:var(--muted);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--well);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line-2)}
.tabs .cnt{background:var(--orange);color:#1b0d00}
.tabsrow .meta{font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- common ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px}
.pad{padding:24px 26px}
@media(max-width:640px){.pad{padding:18px}}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:13.5px}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h2.h{font:700 20px/1.25 var(--f-head);letter-spacing:-.015em;margin:0 0 4px}
h3.h{font:600 17px/1.3 var(--f-head);margin:0 0 4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap;line-height:1.5}
.pill svg{width:13px;height:13px}
.p-live{background:var(--green-soft);color:var(--green)} .p-draft{background:var(--well);color:var(--muted)} .p-closed{background:var(--well);color:var(--ink)}
.p-rev{background:var(--yellow-soft);color:var(--yellow)} .p-app{background:var(--orange-soft);color:var(--orange-ink)} .p-no{background:var(--red-soft);color:var(--red)} .p-pay{background:var(--green-soft);color:var(--green)}
.p-live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.fld{display:grid;gap:6px;min-width:0}
.fld label,.lbl{font-size:14px;font-weight:500}
.inp{height:46px;border:1px solid var(--line-2);border-radius:14px;background:var(--card);padding:0 14px;font-size:15px;width:100%;min-width:0}
.inp:focus{border-color:var(--ink);outline:none}
.inp:disabled{background:var(--well);color:var(--muted)}
textarea.inp{height:auto;padding:12px 14px;resize:vertical}
.err{font-size:13px;color:var(--red)}
.err:empty{display:none}
.icirc{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin-bottom:14px}
.icirc svg{width:27px;height:27px}
.ic-ok{background:var(--green-soft);color:var(--green)} .ic-rev{background:var(--yellow-soft);color:var(--yellow)} .ic-no{background:var(--red-soft);color:var(--red)} .ic-or{background:var(--orange-soft);color:var(--orange-ink)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 18px;font-size:14.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.empty{padding:44px 24px;text-align:center}
.empty h3{font:700 20px/1.2 var(--f-head);margin:0 0 6px}
.empty p{margin:0 0 16px;color:var(--muted)}

/* stat cards */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:20px 22px;display:flex;flex-direction:column;min-width:0}
.kic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line-2);box-shadow:var(--shadow)}
.kic svg{width:20px;height:20px}
.kpi .v{font:700 clamp(26px,2.8vw,34px)/1.1 var(--f-head);letter-spacing:-.03em;margin-top:20px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi .v small{font:600 13.5px var(--f-body);letter-spacing:0}
.kpi .v small.up{color:var(--green)} .kpi .v small.down{color:var(--red)} .kpi .v small.n{color:var(--muted);font-weight:500}
.kpi .l{color:var(--muted);font-size:14.5px;margin-top:4px}
.mini{height:6px;border-radius:999px;background:var(--well);margin-top:12px;overflow:hidden}
.mini span{display:block;height:100%;background:var(--orange);border-radius:999px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}

/* tables */
.tbox{border:1px solid var(--line);border-radius:18px;overflow-x:auto;background:var(--card)}
table.t{width:100%;border-collapse:collapse;min-width:760px;font-size:14.5px}
table.t th{text-align:left;font-size:14px;font-weight:500;color:var(--muted);padding:13px 16px;background:color-mix(in srgb,var(--well) 55%,var(--card));border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.new td{background:color-mix(in srgb,var(--orange-soft) 45%,transparent)}
table.t tr.sel td{background:color-mix(in srgb,var(--well) 80%,transparent)}
table.t .act{text-align:right;white-space:nowrap}
table.t .cb{width:46px}
table.t input[type=checkbox]{width:17px;height:17px;accent-color:var(--black);cursor:pointer;vertical-align:middle}
.nm b{display:block;font-weight:600}
.nm small{display:block;font:400 12.5px var(--f-mono);color:var(--muted);margin-top:1px}
.nm small.p{font-family:var(--f-body)}
.bar2{display:flex;align-items:center;gap:10px;min-width:150px}
.bar2 .tr{flex:1;height:6px;border-radius:999px;background:var(--well);overflow:hidden}
.bar2 .tr span{display:block;height:100%;background:var(--orange)}
.bar2 span.n{font-size:13.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tools .sbox{flex:1 1 240px;height:42px;max-width:360px}
.tbtn{height:42px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);padding:0 14px;display:inline-flex;gap:8px;align-items:center;font-size:14.5px}
.tbtn svg{width:16px;height:16px}
.tbtn:hover,.tbtn[aria-expanded="true"]{border-color:var(--ink)}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:13.5px;color:var(--muted)}
.pager{display:flex;gap:6px}
.pager button{min-width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);font-size:14px}
.pager button[aria-current="page"]{border-color:var(--ink);font-weight:600}
.dots{width:34px;height:34px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);display:inline-grid;place-items:center;padding:0}
.dots svg{width:16px;height:16px}
.qsel{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.qsel select{font-size:14px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--card);border:1px solid var(--line-2);border-radius:10px;height:42px;padding:0 12px}
.tp{display:inline-block;font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap}
.tp.review{background:var(--yellow-soft);color:var(--yellow)} .tp.appeal{background:var(--orange-soft);color:var(--orange-ink)}
.tp.pending{background:var(--well);color:var(--muted)} .tp.paid{background:var(--green-soft);color:var(--green)} .tp.notpaid{background:var(--red-soft);color:var(--red)}
.tl2{white-space:nowrap;font-variant-numeric:tabular-nums}
.tl2.hot{display:inline-block;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--yellow-soft);color:var(--yellow)}
.rvbtn{border:0;background:var(--black);color:var(--on-black);border-radius:10px;padding:8px 16px;font-size:14px;font-weight:500}
.rvbtn.view{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.src{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.src.auto{background:var(--well);color:var(--ink)} .src.you{background:var(--black);color:var(--on-black)} .src.timeout{background:var(--yellow-soft);color:var(--yellow)}
.st{display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:var(--green-bar)}
.st i.no{background:var(--red-bar)}
.who{display:flex;gap:10px;align-items:center}
.tile{width:30px;height:30px;border-radius:9px;display:inline-grid;place-items:center;font:600 11.5px var(--f-mono);flex:none}
.t0{background:var(--green-soft);color:var(--green)} .t1{background:var(--orange-soft);color:var(--orange-ink)} .t2{background:var(--yellow-soft);color:var(--yellow)} .t3{background:var(--well);color:var(--ink)}
.legend2{display:flex;flex-wrap:wrap;align-items:center;gap:10px 30px;padding:11px 16px;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;font-size:13.5px;color:var(--muted);background:var(--card)}
.lgrp{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.lgrp .lt{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);min-width:52px}
.li2{display:inline-flex;align-items:center;gap:7px}
@media(max-width:640px){.lgrp{flex-basis:100%}}
.fwrap{position:relative}
.fpop{position:absolute;right:0;top:50px;z-index:6;background:var(--card);border:1px solid var(--line-2);border-radius:18px;box-shadow:var(--shadow);padding:16px;width:min(290px,calc(100vw - 32px));display:grid;gap:14px}
.fl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.fopt{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13.5px}
.fopt[aria-pressed="true"]{background:var(--black);color:var(--on-black);border-color:var(--black)}
.fc{min-width:18px;height:18px;border-radius:999px;background:var(--orange);color:#1b0d00;font-size:11.5px;font-weight:600;display:inline-grid;place-items:center}

/* dashboard home */
.home{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;margin-top:18px;align-items:start}
@media(max-width:1200px){.home{grid-template-columns:1fr}}
.needs{padding:20px 22px}
.needs .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.needs .it:hover b{text-decoration:underline}
.needs .it b{font-weight:500;display:block}

/* chart */
.chartc{padding:24px 26px;margin-top:18px}
.ch-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.ch-head h3{font:600 19px/1.2 var(--f-head);margin:0 0 4px}
.ch-head span{font-size:13.5px;color:var(--muted)}
.rng{display:inline-flex;background:var(--well);border-radius:999px;padding:4px;gap:2px}
.rng button{border:0;background:transparent;padding:7px 15px;border-radius:999px;color:var(--muted);font-size:14px;white-space:nowrap}
.rng button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.ch-body{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:end}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:14.5px}
.legend li{display:flex;align-items:center;gap:10px}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
.sw.line{width:18px;height:0;border-radius:0;border-top:2px dashed var(--ink)}
.tip{margin-top:20px;border:1px solid var(--line-2);border-radius:16px;padding:13px 15px;font-size:13.5px;color:var(--muted)}
.tip b{color:var(--ink);font-weight:600}
.plot{--u:16px;display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:8px;min-width:0}
.plot.r-today{--u:24px} .plot.r-week{--u:16px} .plot.r-month{--u:14px}
.yax,.area{position:relative;height:calc(var(--u)*var(--rows))}
.yax span{position:absolute;right:0;transform:translateY(50%);font-size:12px;color:var(--faint)}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.pace{position:absolute;left:0;right:0;border-top:2px dashed color-mix(in srgb,var(--ink) 55%,transparent);z-index:1;pointer-events:none}
.pace span{position:absolute;right:0;bottom:4px;font-size:12px;font-weight:500;background:var(--card);padding:1px 6px;border-radius:6px}
.cols,.xl{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.cols{position:absolute;inset:0;align-items:end}
.col{height:100%;border:0;background:none;padding:0 0 2px;display:flex;flex-direction:column-reverse;align-items:center;gap:calc(var(--u)*.2);position:relative;border-radius:10px}
.col:hover,.col.on{background:color-mix(in srgb,var(--well) 70%,transparent)}
.col.off{cursor:default;background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--well) 80%,transparent) 5px 7px)}
.dot{width:calc(var(--u)*.8);height:calc(var(--u)*.8);border-radius:50%;flex:none}
.dot.p{background:var(--green-bar)} .dot.r{background:var(--yellow-bar)} .dot.n{background:var(--red-bar)} .dot.f{box-shadow:inset 0 0 0 1.5px var(--line-2)}
.tt{position:absolute;left:50%;transform:translateX(-50%);background:var(--black);color:var(--on-black);font-size:12.5px;padding:6px 10px;border-radius:10px;white-space:nowrap;z-index:2;pointer-events:none}
.tt.l{left:0;transform:none} .tt.r{left:auto;right:0;transform:none}
.xl span{text-align:center;font-size:12px;color:var(--faint);padding-top:8px;white-space:nowrap}
.xl span.on{color:var(--ink);font-weight:600} .xl span.today{color:var(--orange-ink);font-weight:600}
@media(max-width:820px){.ch-body{grid-template-columns:1fr}.legend{display:flex;flex-wrap:wrap;gap:8px 16px}.chartc{padding:20px 16px}.plot.r-today{--u:18px}.plot.r-week{--u:13px}.plot.r-month{--u:8px}.xl span{font-size:10.5px}}

/* review drawer */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--card);z-index:31;display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}

.dl2{display:grid;gap:10px;margin-top:14px}

.wrow{display:flex;align-items:center;justify-content:space-between;gap:10px}

.dl{display:grid;gap:14px;margin-top:14px}

.code{letter-spacing:.5em;font:600 22px var(--f-mono);text-align:center;height:56px}
.blist{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.blist li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;font-size:13.5px}
.blist li b{display:block;font-size:14.5px}
.blist .ic{width:30px;height:30px;border-radius:9px;background:var(--orange-soft);color:var(--orange-ink);display:grid;place-items:center}
.blist .ic svg{width:15px;height:15px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--orange);margin:1px 0 0;flex:none}
.qprog{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:2px 0 8px}
.qbar{height:6px;border-radius:999px;background:var(--well);overflow:hidden;margin-bottom:16px}
.qbar span{display:block;height:100%;background:var(--orange)}
.aq{font:600 18px/1.35 var(--f-head);margin:0 0 14px}
.ropt{display:flex;align-items:center;gap:12px;border:1px solid var(--line-2);background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:15px}
.ropt input{width:18px;height:18px;accent-color:var(--orange);margin:0}
.ropt:has(input:checked){border-color:var(--orange);background:var(--orange-soft)}
.grow{margin-bottom:12px}
.grow .gl{font-size:14.5px;font-weight:500;margin-bottom:6px}
.gchips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gchips label{position:relative;text-align:center;font-size:12.5px;border:1px solid var(--line-2);border-radius:10px;padding:8px 2px;cursor:pointer;background:var(--card)}
.gchips input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.gchips label:has(input:checked){background:var(--orange);border-color:var(--orange);color:#1b0d00;font-weight:600}
.sumq{display:grid;gap:8px}
.sumq div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.sumq span{display:block;color:var(--muted);font-size:12.5px}
.slist{list-style:none;margin:16px 0;padding:0;display:grid;gap:10px}
.slist li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.slist .s{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);color:var(--muted)}
.slist .s svg{width:15px;height:15px}
.slist li.run .s{background:var(--orange-soft);color:var(--orange-ink)}
.slist li.run .s svg{animation:spin 1s linear infinite}
.slist li.ok .s{background:var(--green-soft);color:var(--green)}
.slist b{display:block;font-size:14.5px}
.slist small{color:var(--muted);font-size:12.5px}
@keyframes spin{to{transform:rotate(360deg)}}
.demo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px;padding:8px 10px;margin-top:auto}
.demo .seg{display:inline-flex;background:var(--well);border-radius:999px;padding:3px}
.demo .seg button{border:0;background:transparent;padding:5px 10px;border-radius:999px;font-size:12.5px;color:var(--muted)}
.demo .seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.res{text-align:center;display:flex;flex-direction:column;align-items:center;padding-top:16px}
.rbox{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;margin-top:8px}
.tln{list-style:none;margin:0;padding:0;display:grid;width:100%}
.tln li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;position:relative;padding-bottom:14px}
.tln li:not(:last-child)::before{content:"";position:absolute;left:10px;top:22px;bottom:2px;border-left:2px solid var(--line-2)}
.tln .d{width:22px;height:22px;border-radius:50%;background:var(--well);border:2px solid var(--line-2)}
.tln li.ok .d{background:var(--green-bar);border-color:var(--green-bar)}
.tln li.now .d{background:var(--yellow-soft);border-color:var(--yellow)}
.tln b{display:block;font-size:14px}
.tln small{color:var(--muted);font-size:12.5px}
.cnt2{text-align:right;font-size:12.5px;color:var(--muted)}

/* auth */
.auth{min-height:calc(100vh - 34px);display:grid;place-items:center;padding:28px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.authc{width:min(480px,100%);padding:30px}
.authc .brand{padding:0;margin-bottom:22px}
.authc h1{font:800 30px/1.1 var(--f-head);letter-spacing:-.03em;margin:0 0 8px}
.authc .stepper{background:none;border:0;padding:0;margin:0 0 26px}
.authc .sp-i small{display:none}
.mmbtn{width:100%;border:1.5px solid var(--orange);background:var(--orange-soft);color:var(--ink);border-radius:999px;padding:16px 20px;font:600 16px/1 var(--f-body);display:flex;align-items:center;justify-content:center;gap:12px}
.mmbtn .fx{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#1b0d00;display:grid;place-items:center}
.mmbtn .fx svg{width:16px;height:16px}
.mmbtn:hover{background:var(--orange);color:#1b0d00}
.why{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:8px;font-size:14px;color:var(--muted)}
.why li{display:flex;gap:10px}
.why svg{width:16px;height:16px;color:var(--green);flex:none;margin-top:3px}
.connected{display:flex;align-items:center;gap:12px;border:1px solid var(--green);background:var(--green-soft);border-radius:16px;padding:12px 14px;margin-bottom:16px}
.connected .fx{width:34px;height:34px;border-radius:10px;background:var(--card);display:grid;place-items:center;color:var(--orange-ink)}
.connected .fx svg{width:18px;height:18px}
.connected b{font-family:var(--f-mono);font-size:13.5px;display:block}
.connected small{color:var(--green)}

/* misc pages */
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media(max-width:900px){.g2{grid-template-columns:1fr}}
.wcard{display:grid;gap:16px}
.bal{font:700 34px/1 var(--f-head);letter-spacing:-.02em}
.hbar{display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:12px;align-items:center;font-size:14px;padding:4px 0}
.hbar .tr{height:12px;border-radius:999px;background:var(--well);overflow:hidden}
.hbar .tr span{display:block;height:100%;background:var(--orange);border-radius:999px}
.hbar .n{text-align:right;color:var(--muted)}
.sbar{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;align-items:center;font-size:14px;padding:5px 0}
.sbar .tr{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px}
.skey{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.skey i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.c0{background:color-mix(in srgb,var(--orange) 20%,var(--well))} .c1{background:color-mix(in srgb,var(--orange) 45%,var(--well))} .c2{background:color-mix(in srgb,var(--orange) 72%,var(--well))} .c3{background:var(--orange)}
@media(max-width:640px){.hbar{grid-template-columns:110px minmax(0,1fr) 30px}.sbar{grid-template-columns:1fr}}
.alist{display:grid;gap:6px;margin-top:10px}
.alist div{background:var(--well);border-radius:12px;padding:10px 14px;font-size:14.5px}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;inset:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line-2);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--orange)}
.switch input:checked+span::after{transform:translateX(20px)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow b{display:block;font-weight:600}
.srow small{color:var(--muted)}
.faq details{border-top:1px solid var(--line);padding:14px 0}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq p{margin:8px 0 0;color:var(--muted)}
/* surveys page: Live — Drafts — Closed */
.sc{display:inline-block;font:600 12px/1.5 var(--f-body);color:var(--muted);background:var(--well);border-radius:999px;padding:0 8px}
.tabs button[aria-selected="true"] .sc{background:var(--card);color:var(--ink)}
/* results: individual responses */
.rnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;max-width:780px}
.rnav .qsel{flex:1 1 auto}
.rnav .qsel select{flex:1;min-width:0;max-width:240px}
.fq.ind .qt{padding-right:0}
.fo:not(.sel){color:var(--muted)}
.fo.sel{font-weight:500}
.fo i.on,table.fg i.on{border-color:var(--orange);background:radial-gradient(circle,var(--orange) 0 42%,transparent 47%)}
.fo i.sq.on{background:var(--orange)}
.sect-e{margin:0;padding:18px 20px;border:1px dashed var(--line-2);border-radius:16px;font-size:14.5px}
/* empty chart */
.nodata{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:2}
.nodata span{font-size:13.5px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px}
/* answer surveys */
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:640px){.kpis.k3{grid-template-columns:1fr}}
.join{padding:18px 20px;margin-bottom:28px;display:grid;gap:12px}
.join .h{margin:0 0 2px;font-size:17px}
.join p{margin:0}
.lnk{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:2px;font:inherit;cursor:pointer}
.join-r{display:flex;gap:8px;flex-wrap:wrap}
.jin{flex:1 1 280px;display:flex;align-items:center;gap:8px;height:46px;border:1px solid var(--line-2);border-radius:12px;padding:0 12px;background:var(--card);min-width:0}
.jin:focus-within{border-color:var(--ink)}
.jin svg{width:16px;height:16px;color:var(--muted);flex:none}
.jin input{border:0;background:none;outline:none;width:100%;min-width:0;height:100%;font:400 14px var(--f-mono)}
.join-r .btn{height:46px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.vh:focus-visible+.upl{outline:2px solid var(--orange);outline-offset:2px}
.upl{cursor:pointer}
.upl.busy{opacity:.6;pointer-events:none}
.sect-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
.sect-t .h{margin:0;display:flex;align-items:center;gap:8px}
.acards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(min-width:1440px){.acards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.acards{grid-template-columns:1fr;gap:12px}}
.acard{padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.acard-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);min-height:24px}
.acard-top>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard-top>span:last-child{flex:none;white-space:nowrap}
.aclose.soon{background:var(--yellow-soft);color:var(--yellow);font-weight:600;padding:2px 10px;border-radius:999px}
.acard .h{margin:2px 0 0;font-size:17px;line-height:1.3}
.adesc{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5;min-height:3em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ameta{list-style:none;margin:auto 0 0;padding:12px 0 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--muted)}
.ameta li{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.ameta svg{width:15px;height:15px;flex:none}
.ameta b{color:var(--ink);font-weight:600}
.aprog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.aprog .tr{flex:1;height:6px;border-radius:999px;background:var(--well);overflow:hidden}
.aprog .tr span{display:block;height:100%;background:var(--orange);border-radius:999px}
.acard .btn{width:100%;margin-top:4px}
.adone{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;margin-top:4px;border-radius:12px;background:var(--well);font-size:14px;color:var(--muted)}
.adone svg{width:15px;height:15px}
@media(max-width:640px){.join{padding:16px}.join-r .btn{flex:1 1 auto}}
.minc{display:flex;flex-direction:column;gap:16px}
.mtiles{display:grid;grid-auto-rows:1fr;gap:12px;flex:1}
.mtile{display:flex;align-items:center;gap:14px;background:var(--well);border-radius:16px;padding:16px 18px;min-width:0}
.mtile b{display:block;font:700 28px/1.15 var(--f-head);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0}
.mtile small{color:var(--muted);font-size:12.5px}
.mtot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid var(--line);padding-top:14px;font-weight:600}
.mtot b{font:700 20px/1.2 var(--f-head);font-variant-numeric:tabular-nums}
.fintro{margin:0 0 14px;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--black);color:var(--on-black);border-radius:999px;padding:10px 10px 10px 20px;font-size:14.5px;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:color-mix(in srgb,var(--on-black) 14%,transparent);color:var(--on-black);border-radius:999px;padding:6px 14px;font-weight:500}
/* ---------- responsive ----------
   ≥1600 wide desktop · ≤1280 laptop · ≤980 tablet (sidebar becomes a drawer) · ≤768 small tablet · ≤640 phone (tables become cards) · ≤420 small phone */
@media(min-width:1600px){.main{padding-left:48px;padding-right:48px}.main>*{max-width:1440px}}
@media(max-width:1280px){.main{padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}.kpis{gap:12px}}
@media(max-width:980px){.ph{padding-bottom:14px;margin-bottom:16px}.home{gap:14px}}
@media(max-width:768px){
  .ph .l{flex:1 1 100%}
  .ph .acts{width:100%}
  .ph .acts .btn{flex:1 1 auto}
  .tabsrow{align-items:stretch}
  .tabsrow .tabs{width:100%}
  .tabs button{padding:8px 14px;font-size:14.5px}
  .tools .sbox{max-width:none}
  .tools .tbtn{flex:1 1 auto;justify-content:center}
  .tools .tabs{flex:1 1 100%}
  .chartc{margin-top:14px}
  .stepper{padding:12px 14px}
  .sp-i small{display:none}
  .sp-ln{min-width:18px;margin:0 8px}
  .drawer{width:100%}
  .dr-body{padding:18px}
}
@media(max-width:640px){
  .tabs.fit{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);overflow:visible}
  .tabs.fit button{padding:8px 4px;justify-content:center;gap:5px;font-size:14px}
  .tabs.fit .sc{padding:0 6px}
  .tbox{border:0;background:none;overflow:visible}
  table.t{min-width:0;display:block}
  table.t thead{display:none}
  table.t tbody{display:grid;gap:10px}
  table.t tr{display:grid;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  table.t tr.new{background:color-mix(in srgb,var(--orange-soft) 45%,var(--card))}
  table.t tr.sel{background:color-mix(in srgb,var(--well) 80%,var(--card))}
  table.t tr.new td,table.t tr.sel td{background:none}
  table.t td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0;border:0;text-align:right;min-width:0;overflow-wrap:anywhere}
  table.t td[data-label]::before{content:attr(data-label);color:var(--muted);font-size:13px;text-align:left;flex:none}
  table.t td:first-child{justify-content:flex-start;text-align:left}
  table.t td:first-child::before,table.t td.act::before{display:none}
  table.t td.act{justify-content:flex-end;padding-top:4px}
  table.t td.cb{width:auto}
  .bar2{min-width:0;flex:0 1 200px}
  .tfoot{justify-content:center;text-align:center}
  .kpi{padding:16px}
  .kpi .v{margin-top:14px}
  .kic{width:36px;height:36px}
  .rnav{padding:8px 10px}
  .rnav .qsel{font-size:0;gap:0}
  .fhead .in,.fq{padding:16px}
  .sv{padding:0;justify-content:flex-start}
  .sv .hdr{margin:10px 12px}
  .phone{width:100%;flex:1;height:auto;max-height:none;min-height:0;border:0;border-radius:0}
}
@media(max-width:420px){
  .banner{font-size:11.5px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .v{font-size:24px}
  .kpi .l{font-size:13px}
  .hbar{grid-template-columns:96px minmax(0,1fr) 26px;gap:8px}
  .mm .ft{grid-template-columns:1fr}
  .btn{padding:10px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== merged: press feedback (Emil: 0.97, not when disabled) ===== */
.btn,.ibtn,.mmbtn,.pf-pill span,.pf-role{transition:transform 120ms var(--ease-out),background-color 150ms ease,border-color 150ms ease,color 150ms ease}
.btn:not(:disabled):active,.ibtn:not(:disabled):active,.mmbtn:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){.btn:active,.ibtn:active,.mmbtn:active{transform:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand-btn{background:none;border:0;color:inherit;cursor:pointer}

/* ===== sign-up ===== */
.two-btn{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.pf-roles{display:grid;gap:10px}
.pf-role{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line-2);background:var(--card);border-radius:18px;padding:16px;cursor:pointer;position:relative}
.pf-role input{position:absolute;opacity:0;pointer-events:none}
.pf-role .ic{width:40px;height:40px;border-radius:12px;background:var(--orange-soft);color:var(--orange-ink);display:grid;place-items:center;flex:none}
.pf-role .ic svg{width:20px;height:20px}
.pf-role b{display:block;font-size:16px}.pf-role small{display:block;color:var(--muted);font-size:14px;line-height:1.4;margin-top:2px}
.pf-role:has(input:checked){border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pf-role:has(input:focus-visible){outline:2px solid var(--orange);outline-offset:2px}
.pf-form{display:grid;gap:20px}
.pf-set{border:0;margin:0;padding:0;min-width:0}
.pf-set legend{font-weight:600;font-size:14.5px;margin-bottom:8px;padding:0}
.pf-pills,.rd-reasons{display:flex;flex-wrap:wrap;gap:8px}
.pf-pill{position:relative;cursor:pointer}
.pf-pill input{position:absolute;opacity:0;pointer-events:none}
.pf-pill span{display:inline-flex;align-items:center;min-height:42px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-size:14.5px}
.pf-pill input:checked+span{background:var(--black);color:var(--on-black);border-color:var(--black)}
.pf-pill input:focus-visible+span{outline:2px solid var(--orange);outline-offset:2px}
.pf-other{display:grid;gap:4px;margin-top:10px;font-size:13px;color:var(--muted);animation:pfIn 200ms var(--ease-out)}
@keyframes pfIn{from{opacity:0;transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.pf-other{animation:none}}
.pf-consent{display:grid;gap:12px;border:1px solid var(--line);background:var(--well);border-radius:16px;padding:14px}
.authc .inp,.authc select.inp{font-size:16px}
.authc{width:min(520px,100%)}
.auth{grid-template-columns:minmax(0,1fr);justify-items:center}
@media (hover:hover) and (pointer:fine){.pf-pill:hover span,.pf-role:hover{border-color:var(--muted)}}

/* ===== review drawer (redesigned) ===== */
.drawer.rd{background:var(--card);animation:rdIn 260ms var(--ease-drawer)}

function authAct(a,el){const A=S.auth;

    else{const qi=Q.findIndex(q=>q.type==='short'),a=((R.ans[qi]||'')+'').trim()||'Ang init sa UMak ngayon grabe';

  return `<div class="sv" role="dialog" aria-modal="true" aria-label="Student view"><div class="scr" data-act="closeSV"></div><div class="hdr">${I.eye.replace('<svg','<svg style="width:16px;height:16px"')}<span>${R.real?'Answering as a respondent · '+esc(me().email):'Student view · what respondents see'}</span><button class="ibtn" data-act="closeSV" aria-label="Close student view">${I.x}</button></div>${ph}</div>`}
let timers=[];const clearT=()=>{timers.forEach(clearTimeout);timers=[]};
function runScreen(){clearT();const tick=()=>{if(!S.sv||S.sv.step!=='screen')return;S.sv.stage++;render();if(S.sv.stage<3)timers.push(setTimeout(tick,900));else timers.push(setTimeout(()=>{if(S.sv&&S.sv.step==='screen')rgo(S.sv.outcome)},900))};timers.push(setTimeout(tick,900))}
function rgo(step){const R=S.sv;R.step=step;if(step==='screen'){R.stage=0;runScreen()}else clearT();if(step==='nopay'&&R.appeal!=='sent')R.appeal='idle';
  if(R.real&&!R.logged&&(step==='pay'||step==='review'||step==='nopay')){const s=ANY(R.sid);R.logged=true;S.answered[R.sid]=step;
    MYPAY.unshift({title:s.title,group:s.group,amt:s.rate,st:{pay:'paid',review:'review',nopay:'no'}[step],tx:step==='pay'?'0x91c4…7e02':'—',when:'Just now',fresh:true})}
  render()}
const newSV=(sid,real)=>({sid,real:!!real,step:'intro',email:real?me().email:'',codeSent:false,code:'',verified:false,agree:false,qi:0,ans:{},wallet:real?MY_WALLET:'',stage:0,outcome:'pay',appeal:'idle',appealText:''});

/* ================= actions ================= */
let tt,lastUndo=null;
function toast(m,undo){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=m;document.getElementById('toastUndo').hidden=!undo;lastUndo=undo||null;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),4000)}
const setErr=(id,m)=>{const e=document.getElementById(id);if(e)e.textContent=m||''};
const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.trim());
function nextAfter(id,order){const P=order.filter(x=>x!==id&&!S.decided[x]);if(!P.length)return null;const i=order.indexOf(id);return P.find(x=>order.indexOf(x)>i)||P[0]}
function decide(d,dec,reason){const order=S.order.slice();S.decided[d.id]={d:dec,reason,seq:++S.seq};S.reasonFor=null;S.reason=0;if(S.openRev===d.id)S.openRev=nextAfter(d.id,order);
  toast(dec==='pay'?`Paid 0.001 tBNB to ${d.wallet}`:d.kind==='appeal'?`Kept unpaid: ${d.wallet}`:`Not paid: ${d.wallet}`,()=>{delete S.decided[d.id];S.openRev=d.id;render();toast('Decision undone')})}
function copy(v,msg){try{navigator.clipboard.writeText(v).then(()=>toast(msg),()=>toast(v))}catch(e){toast(v)}}
function newDraft(){let d=SURVEYS.find(s=>s.status==='draft');
  if(!d){d={id:'new'+SURVEYS.length,code:'SRV-0000'+(15+SURVEYS.length),title:'Untitled survey',status:'draft',resp:0,quota:100,rate:10,deadline:'2026-12-10',closes:'Dec 10',left:'—',desc:'Describe your study in one or two sentences.',q:[{t:'Untitled question',type:'mc',req:true,opts:['Option 1','Option 2']}]};SURVEYS.splice(1,0,d);S.draft[d.id]='build'}
  S.sid=d.id;S.page='survey';S.stab='build';S.launched[d.id]=null;S.draft[d.id]=S.draft[d.id]||'build';S.sideOpen=false;render();try{window.scrollTo({top:0})}catch(e){}}
function act(a,el){if(authAct(a,el))return;const s=SV(S.sid);
  switch(a){
    case 'toLanding':S.landing=true;S.auth.stage='email';render();try{window.scrollTo({top:0})}catch(e){}break;
    case 'lpStart':S.landing=false;S.auth.stage='email';render();try{window.scrollTo({top:0})}catch(e){}break;
    case 'lpScroll':{const t=document.getElementById(el.dataset.to);if(t)t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});break;}
    case 'demoAuthEmail':S.auth.email='juan.delacruz@email.com';render();break;
    case 'authEmail':if(!emailOk(S.auth.email))return setErr('aEmailErr','Enter a valid email, like example@email.com.');S.auth.step=1;render();toast('Code sent (demo)');break;
    case 'authMode':S.auth.mode=S.auth.mode==='up'?'in':'up';render();break;
    case 'fillAuthCode':S.auth.code='482913';render();break;
    case 'authVerify':if(S.auth.code!=='482913')return setErr('aCodeErr','That code is wrong. Use the demo code 482913.');S.auth.step=2;render();break;
    case 'authBack':S.auth.step=0;S.auth.code='';render();break;
    case 'connectMM':S.auth.wallet=true;render();toast('MetaMask connected (demo)');break;
    case 'authSkipTry':setErr('aWalletErr','Connect a wallet to continue. It is required to fund surveys.');break;
    case 'authDone':S.authed=true;try{localStorage.setItem('rf-app-authed','1');localStorage.setItem('rf-app-email',S.auth.email)}catch(e){}S.page='dashboard';render();toast('Welcome to ResFunder');break;
    case 'signOut':S.authed=false;S.landing=true;S.auth={step:0,stage:'email',_k:'',email:'',code:'',wallet:false,mode:'in',pf:null};try{localStorage.removeItem('rf-app-authed')}catch(e){}render();break;
    case 'sideOpen':S.sideOpen=true;render();break;
    case 'sideClose':S.sideOpen=false;render();break;
    case 'toast':toast(el.dataset.msg);break;
    case 'newFund':newDraft();break;
    case 'copyLink':copy('resfunder.app/s/'+S.sid,'Share link copied');break;
    case 'copyAddr':copy(MY_WALLET,'Address copied');break;
    case 'copyW':copy(el.dataset.w,'Wallet copied');break;
    case 'studentView':S.sv=newSV(S.sid,false);render();break;
    case 'openLink':openByLink(S.jLink,'link');break;
    case 'sampleLink':S.jLink='https://resfunder.app/s/pets';render();setErr('jErr','');break;
    case 'closeSV':clearT();S.sv=null;render();break;
    case 'addOpt':s.q[+el.dataset.i].opts.push('Option '+(s.q[+el.dataset.i].opts.length+1));render();break;
    case 'addQ':s.q.push({t:'Untitled question',type:'short',req:false});render();toast('Question added');break;
    case 'delQ':if(s.q.length<=1)return toast('A survey needs at least one question');s.q.splice(+el.dataset.i,1);render();break;
    case 'toFund':if(s.q.some(q=>!q.t.trim()))return toast('Every question needs text');S.draft[s.id]='fund';render();try{window.scrollTo({top:0})}catch(e){}break;
    case 'toBuild':S.draft[s.id]='build';render();break;
    case 'openMM':if(!(s.rate>=1&&s.quota>=1))return setErr('fundErr','Enter a pay rate and a quota of at least 1.');S.mm=true;render();break;
    case 'mmReject':S.mm=false;render();toast('Transaction rejected in MetaMask');break;
    case 'mmConfirm':S.mm=false;s.status='live';s.left='14d';S.launched[s.id]='share';render();toast('Budget locked · survey is live');break;
    case 'toOverview':S.launched[s.id]=null;S.stab='overview';render();break;
    case 'askClose':S.closeAsk=true;render();break;
    case 'cancelClose':S.closeAsk=false;render();break;
    case 'doClose':{const amt=s.id==='sleep'?stats().left:s.rate*(s.quota-s.resp);S.closeAsk=false;s.status='closed';s.left='Closed';s.closes='Today';s.refunded={amt,paid:s.id==='sleep'?stats().paid:s.rate*s.resp};render();toast(`Closed · ${peso(amt)} refunded to your wallet`);break;}
    case 'pay':decide(byRev(el.dataset.id),'pay');render();break;
    case 'keep':decide(byRev(el.dataset.id),'no','Appeal rejected');render();break;
    case 'no':S.reasonFor=el.dataset.id;S.reason=0;render();break;
    case 'cancelNo':S.reasonFor=null;render();break;
    case 'confirmNo':{const d=byRev(el.dataset.id);decide(d,'no',d.reasons[S.reason]);render();break;}
    case 'undo':delete S.decided[el.dataset.id];S.openRev=el.dataset.id;render();toast('Decision undone');break;
    case 'skip':{const o=S.order.slice(),id=el.dataset.id;S.order=S.order.filter(x=>x!==id).concat(id);S.openRev=nextAfter(id,o)||id;S.reasonFor=null;render();toast('Skipped. Moved to the end of the queue.');break;}
    case 'closeRev':S.openRev=null;S.reasonFor=null;render();break;
    case 'qClear':S.qQ='';S.qType='all';S.qStatus='pending';render();break;
    case 'fToggle':S.fOpen=!S.fOpen;render();break;
    case 'lClear':S.lQ='';S.lRes='all';S.lBy='all';render();break;
    case 'export':toast(S.lSel.size?`Exports ${S.lSel.size} selected decisions as CSV in the real app`:'Exports the decisions shown as CSV in the real app');break;
  }}
function ract(a){const R=S.sv,Q=ANY(R.sid).q;
  switch(a){
    case 'demoEmail':R.email='maria.santos@email.com';render();break;
    case 'sendCode':if(!emailOk(R.email))return setErr('rEmailErr','Enter a valid email, like example@email.com.');R.verified=true;rgo('consent');break;
    case 'fillCode':R.code='482913';render();break;
    case 'checkCode':if(R.code!=='482913')return setErr('rCodeErr','That code is wrong. Use the demo code 482913.');R.verified=true;render();break;
    case 'agree':if(!R.agree)return setErr('rAgreeErr','Tick the box to continue.');R.qi=0;rgo('answer');break;
    case 'prevQ':if(R.qi>0){R.qi--;render()}else rgo('consent');break;
    case 'nextQ':{const q=Q[R.qi],a=R.ans[R.qi];let ok=true;if(q.req){if(q.type==='mc')ok=a!=null;else if(q.type==='cb')ok=(a||[]).length>0;else if(q.type==='grid')ok=Object.keys(a||{}).length===q.rows.length;else ok=!!(a||'').trim()}
      if(!ok)return setErr('rAnsErr',q.type==='grid'?'Answer every row to continue.':'Answer this question to continue.');if(R.qi<Q.length-1){R.qi++;render()}else rgo('wallet');break;}
    case 'demoW':R.wallet=DEMO_WALLET;render();break;
    case 'submit':if(!/^0x[0-9a-fA-F]{40}$/.test(R.wallet.trim()))return setErr('rWErr','Enter a full wallet address (0x followed by 40 characters).');rgo('screen');break;
    case 'openAppeal':R.appeal='form';render();break;
    case 'cancelAppeal':R.appeal='idle';render();break;
    case 'sendAppeal':if(R.appealText.trim().length<10)return setErr('rApErr','Write at least a short sentence (10 characters).');R.appeal='sent';render();break;
    case 'restart':if(R.real){const st=S.answered[R.sid];clearT();S.sv=null;render();toast(st==='pay'?`${peso(ANY(R.sid).rate)} added to your payouts`:st==='review'?'Thanks. It shows as In review in your payouts.':'Thanks for answering');break}
      Object.assign(R,{step:'intro',email:'',codeSent:false,code:'',verified:false,agree:false,qi:0,ans:{},wallet:'',stage:0,appeal:'idle',appealText:''});clearT();render();toast('Thanks for answering');break;
  }}
